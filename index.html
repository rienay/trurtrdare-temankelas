<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truth or Dare Anak Kuliah 🎓</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#141e30,#243b55,#3b82f6);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  overflow:hidden;
}

.container{
  width:100%;
  max-width:750px;
  background:rgba(255,255,255,0.95);
  border-radius:30px;
  padding:35px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
  position:relative;
}

h1{
  color:#2563eb;
  font-size:2.5rem;
  margin-bottom:10px;
}

.subtitle{
  color:#666;
  margin-bottom:25px;
}

.name-box{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

input{
  flex:1;
  padding:14px;
  border-radius:15px;
  border:2px solid #93c5fd;
  outline:none;
  font-size:1rem;
}

.dice{
  width:130px;
  height:130px;
  margin:20px auto;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  border-radius:25px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-weight:bold;
  font-size:1.2rem;
  padding:10px;
  box-shadow:0 10px 25px rgba(37,99,235,0.4);
}

.shake{
  animation:shake .5s;
}

@keyframes shake{
  0%{transform:rotate(0)}
  25%{transform:rotate(8deg)}
  50%{transform:rotate(-8deg)}
  75%{transform:rotate(8deg)}
  100%{transform:rotate(0)}
}

button{
  padding:14px 24px;
  border:none;
  border-radius:15px;
  cursor:pointer;
  margin:5px;
  font-size:1rem;
  font-weight:bold;
  transition:.3s;
}

button:hover{
  transform:scale(1.05);
}

.roll{
  background:#2563eb;
  color:white;
}

.truth{
  background:#7c3aed;
  color:white;
}

.dare{
  background:#ef4444;
  color:white;
}

.random{
  background:#f59e0b;
  color:white;
}

.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
  padding:20px;
}

.popup-content{
  width:100%;
  max-width:550px;
  background:white;
  border-radius:30px;
  padding:30px;
  position:relative;
  animation:popup .3s ease;
}

@keyframes popup{
  from{
    transform:scale(.7);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.close{
  position:absolute;
  top:15px;
  right:20px;
  cursor:pointer;
  font-size:1.5rem;
}

.popup-title{
  font-size:1.5rem;
  color:#2563eb;
  margin-bottom:15px;
}

.popup-text{
  font-size:1.1rem;
  color:#444;
  line-height:1.7;
}

.float{
  position:absolute;
  font-size:24px;
  animation:float 8s linear infinite;
  opacity:.4;
}

@keyframes float{
  from{
    transform:translateY(100vh);
  }
  to{
    transform:translateY(-120vh);
  }
}
</style>
</head>
<body>

<div class="container">
  <h1>🎓 Truth or Dare Anak Kuliah</h1>
  <p class="subtitle">Main bareng teman kampus biar makin chaos 😭</p>

  <div class="name-box">
    <input type="text" id="name1" placeholder="Nama Mahasiswa 1">
    <input type="text" id="name2" placeholder="Nama Mahasiswa 2">
  </div>

  <div class="dice" id="dice">🎲</div>

  <button class="roll" onclick="rollDice()">🎲 Putar Dadu</button>

  <h3 id="turnText" style="margin-top:15px;color:#666;">Giliran akan muncul di sini</h3>

  <div style="margin-top:20px;">
    <button class="truth" onclick="getTruth()">😂 Truth</button>
    <button class="dare" onclick="getDare()">🔥 Dare</button>
    <button class="random" onclick="getRandom()">🎲 Acak</button>
  </div>
</div>

<div class="popup" id="popup">
  <div class="popup-content">
    <span class="close" onclick="closePopup()">✖</span>
    <div class="popup-title" id="popupTitle"></div>
    <div class="popup-text" id="popupText"></div>
  </div>
</div>

<script>
const truths = [
  'Siapa crush kamu di kampus? 😳',
  'Pernah telat karena kesiangan? 😭',
  'Mata kuliah paling bikin stres?',
  'Pernah tidur pas kelas online?',
  'Siapa dosen paling ditakuti?',
  'Pernah naksir kakak tingkat?',
  'Pernah lupa deadline tugas?',
  'Siapa teman paling chaos di kelas?',
  'Pernah salah kirim chat ke dosen?',
  'Siapa yang paling mungkin jadi budak revisi?'
];

const dares = [
  'Tirukan dosen favorit 15 detik 🎤',
  'Nyanyi lagu galau kampus 😭',
  'Joget random 10 detik 💃',
  'Spam emoji 😭 ke grup kelas 📱',
  'Ngomong pakai bahasa alien 20 detik 👽',
  'Baca chat terakhir dengan ekspresi drama 😆',
  'Teriak “AKU BUTUH LIBUR” 🤣',
  'Foto selfie paling absurd 📸',
  'Tirukan teman paling lucu 😭',
  'Bilang “aku sayang tugas” dengan serius 📚'
];

let currentPlayer = '';

function rollDice(){
  const name1 = document.getElementById('name1').value || 'Mahasiswa 1';
  const name2 = document.getElementById('name2').value || 'Mahasiswa 2';

  const players = [name1,name2];
  currentPlayer = players[Math.floor(Math.random()*players.length)];

  const dice = document.getElementById('dice');
  dice.classList.add('shake');

  setTimeout(()=>{
    dice.innerHTML = currentPlayer;
    dice.classList.remove('shake');
  },500);

  document.getElementById('turnText').innerHTML = '🎯 Giliran: ' + currentPlayer;
}

function showPopup(title,text){
  document.getElementById('popupTitle').innerHTML = title;
  document.getElementById('popupText').innerHTML = '<b>' + (currentPlayer || 'Pemain') + '</b><br><br>' + text;
  document.getElementById('popup').style.display = 'flex';
}

function closePopup(){
  document.getElementById('popup').style.display = 'none';
}

function getTruth(){
  const randomTruth = truths[Math.floor(Math.random()*truths.length)];
  showPopup('😂 Truth',randomTruth);
}

function getDare(){
  const randomDare = dares[Math.floor(Math.random()*dares.length)];
  showPopup('🔥 Dare',randomDare);
}

function getRandom(){
  if(Math.random() < 0.5){
    getTruth();
  }else{
    getDare();
  }
}

for(let i=0;i<20;i++){
  const emoji = document.createElement('div');
  emoji.classList.add('float');
  emoji.innerHTML = ['🎓','📚','😭','✨','☕'][Math.floor(Math.random()*5)];
  emoji.style.left = Math.random()*100 + 'vw';
  emoji.style.animationDuration = (Math.random()*5+5) + 's';
  emoji.style.fontSize = (Math.random()*20+20) + 'px';
  document.body.appendChild(emoji);
}
</script>

</body>
</html>
